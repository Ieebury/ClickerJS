
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Seabury Clicker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="background"></div>

    <div id="game">

        <div id="textbox">
            Samuel Seabury awaits.
        </div>

        <img
            id="character"
            src="sprites/phase1/phase1.svg"
        >
        <div id="pointsDisplay">Points: 0</div>
        
        <button id="upgradeButton">
            Upgrade
        </button>

    </div>

    <audio id="bgm" loop></audio>

    <audio
        id="talkSound"
        src="audio/talk.wav">
    </audio>

    <script src="script.js"></script>

</body>
</html>
